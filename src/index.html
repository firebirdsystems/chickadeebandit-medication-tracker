<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medications</title>
  <base href="/run/medication-tracker/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #0891b2);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #0e7490);
      --accent-light: #ecfeff;
      --green:        #16a34a;
      --green-light:  #dcfce7;
      --red:          #dc2626;
      --amber:        #d97706;
      --amber-light:  #fef3c7;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* ── Header ──────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .header-left h1 { font-size: 1.25rem; font-weight: 700; }
    .header-left .date-label { font-size: 0.82rem; color: var(--muted); margin-top: 1px; }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
    }
    .tab.active { background: white; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
    .btn-danger { background: var(--red); color: white; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
      transition: color .15s, background .15s;
    }
    .btn-icon:hover { color: var(--text); background: var(--border); }

    /* ── Cards ───────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; font-weight: 700; color: white;
      flex-shrink: 0;
    }
    .card-header .member-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
    .card-header .badge-done {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--green);
      background: var(--green-light);
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── Medication rows ──────────────────────────────────── */
    .med-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .med-row:last-child { border-bottom: none; }
    .med-row-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .med-name { font-weight: 600; font-size: 0.95rem; }
    .med-dosage { font-size: 0.8rem; color: var(--muted); }
    .med-notes { font-size: 0.8rem; color: var(--muted); margin-top: 2px; font-style: italic; }
    .med-actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* ── Slot pills ──────────────────────────────────────── */
    .slots { display: flex; flex-wrap: wrap; gap: 6px; }
    .slot-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
      line-height: 1.2;
    }
    .slot-pill:hover:not(.taken) {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .slot-pill.taken {
      background: var(--green-light);
      border-color: var(--green);
      color: var(--green);
    }

    /* ── Manage list ─────────────────────────────────────── */
    .manage-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .manage-row:last-child { border-bottom: none; }
    .manage-row .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: white;
      flex-shrink: 0;
    }
    .manage-info { flex: 1; min-width: 0; }
    .manage-info .name { font-weight: 600; font-size: 0.9rem; }
    .manage-info .meta { font-size: 0.78rem; color: var(--muted); }
    .archived-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: var(--border);
      padding: 2px 7px;
      border-radius: 20px;
    }
    .archived-row { opacity: .55; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
      padding: 0;
    }
    @media (min-width: 480px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      background: white;
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 560px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      /* Nothing in a form should ever scroll sideways — rows below wrap instead. */
      overflow-x: hidden;
    }
    @media (min-width: 480px) {
      .modal { border-radius: var(--radius); }
    }
    @media (max-width: 479px) {
      .modal { padding: 20px 16px; }
    }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    /* Checkboxes/radios must be excluded — they live inside the toggle pills and
       the recipient lists, where a 100%-wide, text-input-padded box blows the row
       out past the modal. */
    .form-group input:not([type="checkbox"]):not([type="radio"]),
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      background: white;
      color: var(--text);
    }
    .form-group textarea { resize: vertical; min-height: 64px; }
    /* Side-by-side fields. Date/time inputs carry a wide intrinsic min-width, so
       without min-width:0 they refuse to shrink and push the modal sideways. */
    .form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .form-row > input,
    .form-row > select { flex: 1 1 140px; min-width: 0; width: auto; }
    .form-row > .btn { flex: 0 0 auto; }
    .form-group input:not([type="checkbox"]):not([type="radio"]):focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group input[type="checkbox"],
    .form-group input[type="radio"] { flex: 0 0 auto; accent-color: var(--accent); }

    .toggle-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
    }
    .toggle-pill.on {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; justify-content: center; }
    .modal-danger-zone {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    /* ── Misc ────────────────────────────────────────────── */
    .empty { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 0.9rem; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 18px 0 8px;
    }
    .section-title:first-child { margin-top: 0; }
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .show-archived-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .show-archived-toggle input { cursor: pointer; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { hubAlert, memberColor, initial, esc, isAdult, hubConfirm, searchMatch } from "/hub-sdk.js";
import {
  todayDate, parseJsonArray,
  medicationTimes, normalizeTimes, normalizeDaysMask, normalizeMemberIds,
  formatTime, isClockTime, remindersEnabled, MAX_TIMES,
  withArchivedState,
  canViewMedication, canManageMedications, canEditMedication,
  isDoseTaken, existingDoseKey, slotFromDoseKey, nextTodayKey,
  allDosesComplete, groupByMember, searchableFields,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const REMINDER_STATUS = "api/reminders-schedule-status";
const APP_ID  = window.__APP_ID      ?? "medication-tracker";
const ME      = window.__CURRENT_MEMBER ?? null;
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const IS_ADMIN  = window.__IS_ADMIN === true;
const IS_ROSTER = window.__SPACE_KIND === "roster";
// Who may manage medication regimens (add / edit / archive). In a roster (a care
// coordinator's client list) that's the steward alone; every other member only
// logs their own doses. Elsewhere any adult manages. Matches the hub medications
// policy (adult_writable + member_read_column + steward_writes_only). Logging a
// dose is never gated — that stays every member's own.
const amManage = (m) => IS_ROSTER ? IS_ADMIN : isAdult(m);

// ── State ──────────────────────────────────────────────────────────────────
let members      = [];
let medications  = []; // non-archived active meds
let archivedMeds = []; // archived meds (loaded only in manage tab)
let doses        = {}; // keyed by `${medId}__${date}__${slot}`
let activeTab    = "today";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let showArchived = false;
let modalEl      = null;
let TODAY        = todayDate();
let reminderStatus = null;

const DEMO_MEMBERS = [
  { id: "parent-1", name: "Alex",   role: "adult" },
  { id: "kid-1",    name: "Jordan", role: "child" },
  { id: "kid-2",    name: "Casey",  role: "child" },
];
const DEMO_MEDS = [
  { id: "m1", member_id: "parent-1", name: "Vitamin D",      dosage: "2000 IU",  notes: "",               reminder_times: '["08:00"]',          reminders_on: 1, archived: 0, created_at: "2026-01-01T00:00:00Z" },
  { id: "m2", member_id: "kid-1",    name: "Allergy Tablet",  dosage: "10mg",     notes: "Take with food", reminder_times: '["08:00","18:00"]',  reminders_on: 1, archived: 0, created_at: "2026-01-01T00:00:00Z" },
  { id: "m3", member_id: "kid-2",    name: "Vitamin C",       dosage: "250mg",    notes: "",               reminder_times: '["08:00"]',          reminders_on: 0, archived: 0, created_at: "2026-01-01T00:00:00Z" },
];

// ── DB helper ──────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  // `changed: 1` in demo mode (no hub): callers that gate on the affected-row
  // count must not read the absence of a database as "the write matched
  // nothing".
  if (!DB) return { rows: [], changed: 1 };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body?.error) {
    throw new Error(body?.error || `Database request failed (${res.status})`);
  }
  return body;
}

/**
 * Fire-and-forget publish. Payload is identifiers only — never the medication
 * name. Medications are `owner_only` on member_id, so the drug someone takes is
 * their business, while the event bus is household-wide.
 */
async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS_URL) return;
  await fetch(EVENTS_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

// ── Data loading ───────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) { members = DEMO_MEMBERS; return; }
  try {
    const res  = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  } catch { members = []; }
}

async function loadMedications() {
  if (!DB) {
    medications  = DEMO_MEDS.filter(m => !m.archived);
    archivedMeds = DEMO_MEDS.filter(m => m.archived);
    return;
  }
  const [active, archived] = await Promise.all([
    db(`SELECT id, member_id, name, dosage, notes, schedule_slots, reminder_times, reminders_on,
               days_mask, every_n_days, started_on, ends_on, remind_member_ids, buddy_member_ids,
               archived, created_at
        FROM app_medication_tracker__medications WHERE archived = 0 ORDER BY created_at ASC`),
    db(`SELECT id, member_id, name, dosage, notes, schedule_slots, reminder_times, reminders_on,
               days_mask, every_n_days, started_on, ends_on, remind_member_ids, buddy_member_ids,
               archived, created_at
        FROM app_medication_tracker__medications WHERE archived = 1 ORDER BY created_at ASC`),
  ]);
  medications  = active.rows;
  archivedMeds = archived.rows;
}

async function loadDoses() {
  if (!DB) { doses = {}; return; }
  const { rows } = await db(
    `SELECT medication_id, dose_date, slot, logged_by FROM app_medication_tracker__doses WHERE dose_date = ?`,
    [TODAY]
  );
  doses = {};
  for (const r of rows) {
    doses[`${r.medication_id}__${r.dose_date}__${r.slot}`] = { loggedBy: r.logged_by };
  }
}

async function loadReminderStatus() {
  if (!DB) {
    reminderStatus = {
      entitled: true, escalation_entitled: false, unmonitored_row_ids: [],
      app_monitored_count: medications.filter(remindersEnabled).length, cap: 10,
    };
    return;
  }
  try {
    const res = await fetch(REMINDER_STATUS, { headers: { Accept: "application/json" } });
    reminderStatus = res.ok ? await res.json() : null;
  } catch {
    reminderStatus = null;
  }
}

async function refreshLocalDay(now = new Date()) {
  const next = nextTodayKey(TODAY, now);
  if (!next.changed) return false;
  TODAY = next.today;
  await loadDoses();
  render();
  return true;
}

// ── Visibility helpers ─────────────────────────────────────────────────────
function myMember() {
  return ME ? members.find(m => m.id === ME.id) ?? ME : null;
}

function visibleMeds() {
  const me = myMember();
  return medications.filter(med => canViewMedication(med, me, members));
}

function unmonitoredIds() {
  return new Set(Array.isArray(reminderStatus?.unmonitored_row_ids)
    ? reminderStatus.unmonitored_row_ids.map(String)
    : []);
}

function reminderStatusHtml() {
  if (!reminderStatus) {
    return `<div class="empty" style="padding:10px">Reminder status is temporarily unavailable.</div>`;
  }
  const unmonitored = unmonitoredIds().size;
  const escalation = reminderStatus.escalation_entitled
    ? "Missed-dose escalation is active."
    : "Basic reminders are active; missed-dose escalation requires Premium.";
  const entitlement = reminderStatus.entitled
    ? ""
    : " This app’s scheduled reminders require the Premium cron capability.";
  return `<div class="med-notes" style="margin:0 0 12px">
    Monitoring ${Number(reminderStatus.app_monitored_count ?? 0)} of ${Number(reminderStatus.cap ?? 0)}
    available reminder slots. ${esc(escalation + entitlement)}
    ${unmonitored ? `<strong>${unmonitored} medication${unmonitored === 1 ? " is" : "s are"} not being monitored.</strong>` : ""}
  </div>`;
}

// ── Dose toggle ────────────────────────────────────────────────────────────
window.toggleDose = async function(medId, slot) {
  await refreshLocalDay();
  const storedKey = existingDoseKey(doses, medId, slot, TODAY);
  const key = `${medId}__${TODAY}__${slot}`;
  const taking = storedKey === null;

  if (!taking) {
    const ok = await hubConfirm({ message: "Mark as not taken?", confirmLabel: "Undo", destructive: false });
    if (!ok) return;
  }

  if (taking) {
    doses[key] = true;
    render();
    try {
      await db(
        `INSERT INTO app_medication_tracker__doses (medication_id, dose_date, slot, taken_at, logged_by)
         VALUES (?, ?, ?, ?, ?)
         ON CONFLICT (medication_id, dose_date, slot) DO NOTHING`,
        [medId, TODAY, slot, new Date().toISOString(), ME?.id ?? "demo"]
      );
      await loadDoses();
      // Only the taken direction is announced: undoing a dose has no retraction
      // on the bus, and a "not taken after all" event no consumer handles would
      // be worse than silence.
      await publishEvent("medication.dose_taken", medId, {
        medication_id: medId,
        member_id: medications.find(m => m.id === medId)?.member_id || undefined,
        logged_by: ME?.id || undefined,
        dose_date: TODAY,
        slot,
      });
    } catch (error) {
      delete doses[key];
      render();
      hubAlert(`Could not mark this dose taken: ${error.message}`);
    }
  } else {
    const storedSlot = slotFromDoseKey(storedKey, TODAY);
    const previous = doses[storedKey];
    delete doses[storedKey];
    render();
    try {
      // The row policy narrows this DELETE to rows the caller may write, so a
      // child trying to undo a dose their parent logged matches nothing and
      // returns 200 — the optimistic UI cleared the tick, the next load put it
      // back, and the child could repeat that forever with no explanation.
      // `changed` is what distinguishes "deleted" from "matched nothing".
      const { changed } = await db(
        `DELETE FROM app_medication_tracker__doses
          WHERE medication_id = ? AND dose_date = ? AND slot = ?`,
        [medId, TODAY, storedSlot]
      );
      if (!changed) {
        doses[storedKey] = previous;
        render();
        hubAlert("This dose was logged by someone else, so only they (or an adult) can undo it.");
        return;
      }
      await loadDoses();
    } catch (error) {
      doses[storedKey] = previous;
      render();
      hubAlert(`Could not undo this dose: ${error.message}`);
    }
  }
  render();
};


// ── Schedule editor (clock times) ──────────────────────────────────────────
// The schedule is the list of wall-clock times a medication is due. Each time
// becomes an occurrence the hub nudges for, and each tick-off writes a dose row
// keyed by that same time — which is how a nudge stops escalating.
let editorTimes = [];

function memberChecksHtml(cssClass, selectedRaw, ownerId, includeOwner = true) {
  const selected = new Set(parseJsonArray(selectedRaw));
  return members
    .filter(member => member.role !== "guest" && (includeOwner || member.id !== ownerId))
    .map(member => `<label style="display:flex;align-items:center;gap:6px;text-transform:none;font-weight:400;min-width:0;overflow-wrap:anywhere">
      <input type="checkbox" class="${cssClass}" value="${esc(member.id)}"
             ${selected.has(member.id) ? "checked" : ""} />
      ${esc(member.name)}
    </label>`).join("");
}

function scheduleEditorHtml(times, remindersOn, med = {}) {
  editorTimes = normalizeTimes(times);
  const selectedDays = new Set(String(med.days_mask ?? "").split(",").map(Number).filter(Boolean));
  const everyDay = selectedDays.size === 0;
  const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const dayChecks = dayNames.map((name, index) =>
    `<label class="toggle-pill ${everyDay || selectedDays.has(index + 1) ? "on" : ""}"
            style="display:inline-flex;align-items:center;gap:4px">
       <input type="checkbox" class="f-day" value="${index + 1}"
              ${everyDay || selectedDays.has(index + 1) ? "checked" : ""} />
       ${name}
     </label>`).join("");
  return `
    <div class="form-group">
      <label>Schedule</label>
      <div id="f-times" class="toggle-group" style="flex-wrap:wrap;gap:6px"></div>
      <div class="form-row" style="margin-top:8px">
        <input id="f-new-time" type="time" step="300" style="flex:0 1 auto" />
        <button type="button" class="btn btn-ghost btn-sm" data-action="add-time">Add time</button>
      </div>
    </div>
    <div class="form-group">
      <label>Days</label>
      <div class="toggle-group" style="flex-wrap:wrap;gap:6px">${dayChecks}</div>
    </div>
    <div class="form-group">
      <label>Course dates <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <div class="form-row">
        <input id="f-started-on" type="date" value="${esc(med.started_on ?? "")}" aria-label="Starts on" />
        <input id="f-ends-on" type="date" value="${esc(med.ends_on ?? "")}" aria-label="Ends on" />
      </div>
      <label style="margin-top:10px">Repeat every N days</label>
      <input id="f-every-n-days" type="number" min="1" max="366"
             value="${esc(String(med.every_n_days ?? 1))}" />
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500">
        <input id="f-reminders-on" type="checkbox" ${remindersOn ? "checked" : ""} />
        Send a reminder at each time
      </label>
      <div style="font-size:.78rem;color:var(--muted);margin-top:4px">
        Reminders during your quiet hours appear in your inbox but won't buzz.
      </div>
    </div>
    <div class="form-group">
      <label>Reminder recipients <span style="font-weight:400;text-transform:none">(optional; defaults to the person taking it)</span></label>
      <div class="toggle-group" style="display:grid;gap:4px">
        ${memberChecksHtml("f-remind-member", med.remind_member_ids, med.member_id, true)}
      </div>
    </div>
    <div class="form-group">
      <label>Missed-dose escalation <span style="font-weight:400;text-transform:none">(Premium)</span></label>
      <div class="toggle-group" style="display:grid;gap:4px">
        ${memberChecksHtml("f-buddy-member", med.buddy_member_ids ?? "[]", med.member_id, true)
          || `<span style="font-size:.82rem;color:var(--muted)">No eligible caregiver recipients.</span>`}
      </div>
      <div style="font-size:.78rem;color:var(--muted);margin-top:4px">
        Leave everyone unchecked to disable missed-dose escalation for this medication.
      </div>
    </div>
  `;
}

function renderEditorTimes() {
  const host = document.getElementById("f-times");
  if (!host) return;
  host.innerHTML = editorTimes.length
    ? editorTimes.map(t =>
        `<button type="button" class="toggle-pill on" data-action="remove-time" data-time="${esc(t)}"
                 title="Remove this time">${esc(formatTime(t))} ✕</button>`
      ).join("")
    : `<span style="font-size:.82rem;color:var(--muted)">No times yet — add one below.</span>`;
}

window.addEditorTime = function() {
  const el = document.getElementById("f-new-time");
  const value = el?.value ?? "";
  if (!isClockTime(value)) { hubAlert("Pick a valid time."); return; }
  if (editorTimes.length >= MAX_TIMES) {
    hubAlert(`A medication can have at most ${MAX_TIMES} times a day.`);
    return;
  }
  editorTimes = normalizeTimes([...editorTimes, value]);
  renderEditorTimes();
};

window.removeEditorTime = function(time) {
  editorTimes = editorTimes.filter(t => t !== time);
  renderEditorTimes();
};

// ── Save medication ────────────────────────────────────────────────────────
window.submitMedication = async function(existingId) {
  const nameEl = document.getElementById("f-name");
  const name   = nameEl?.value.trim() ?? "";
  if (!name) { nameEl?.focus(); return; }

  const memberId = document.getElementById("f-member")?.value ?? ME?.id ?? "";
  const dosage   = document.getElementById("f-dosage")?.value.trim() ?? "";
  const notes    = document.getElementById("f-notes")?.value.trim() ?? "";

  const times = normalizeTimes(editorTimes);
  if (!times.length) {
    hubAlert("Add at least one time to the schedule.");
    return;
  }
  const remindersOn = document.getElementById("f-reminders-on")?.checked ? 1 : 0;
  const timesJson = JSON.stringify(times);
  const selectedDays = [...document.querySelectorAll(".f-day:checked")].map(el => el.value);
  const daysMask = selectedDays.length === 7 ? "" : normalizeDaysMask(selectedDays);
  const startedOn = document.getElementById("f-started-on")?.value ?? "";
  const endsOn = document.getElementById("f-ends-on")?.value ?? "";
  const everyNDays = Number(document.getElementById("f-every-n-days")?.value || 1);
  if (!Number.isInteger(everyNDays) || everyNDays < 1 || everyNDays > 366) {
    hubAlert("Repeat interval must be between 1 and 366 days.");
    return;
  }
  if (everyNDays > 1 && !startedOn) {
    hubAlert("Choose a start date when repeating every N days.");
    return;
  }
  if (startedOn && endsOn && endsOn < startedOn) {
    hubAlert("The end date must be on or after the start date.");
    return;
  }
  const remindMemberIds = normalizeMemberIds(
    [...document.querySelectorAll(".f-remind-member:checked")].map(el => el.value),
  );
  const buddyMemberIds = normalizeMemberIds(
    [...document.querySelectorAll(".f-buddy-member:checked")].map(el => el.value),
  );

  const now = new Date().toISOString();

  if (existingId) {
    // Optimistic: update in place
    const idx = medications.findIndex(m => m.id === existingId);
    const previous = idx === -1 ? null : { ...medications[idx] };
    if (idx !== -1) {
      medications[idx] = { ...medications[idx], name, dosage, notes,
        reminder_times: timesJson, reminders_on: remindersOn, days_mask: daysMask,
        every_n_days: everyNDays, started_on: startedOn, ends_on: endsOn,
        remind_member_ids: remindMemberIds, buddy_member_ids: buddyMemberIds };
    }
    closeModal();
    render();
    try {
      await db(
        `UPDATE app_medication_tracker__medications
            SET name=?, dosage=?, notes=?, reminder_times=?, reminders_on=?,
                days_mask=?, every_n_days=?, started_on=?, ends_on=?,
                remind_member_ids=?, buddy_member_ids=?
         WHERE id=?`,
        [name, dosage, notes, timesJson, remindersOn, daysMask, everyNDays,
          startedOn, endsOn, remindMemberIds, buddyMemberIds, existingId]
      );
      await Promise.all([loadMedications(), loadReminderStatus()]);
      render();
    } catch (error) {
      if (idx !== -1 && previous) medications[idx] = previous;
      render();
      hubAlert(`Could not save this medication: ${error.message}`);
    }
  } else {
    // Optimistic: append new med
    const id = crypto.randomUUID();
    medications.push({ id, member_id: memberId, name, dosage, notes,
      reminder_times: timesJson, reminders_on: remindersOn, days_mask: daysMask,
      every_n_days: everyNDays, started_on: startedOn, ends_on: endsOn,
      remind_member_ids: remindMemberIds, buddy_member_ids: buddyMemberIds,
      archived: 0, created_at: now });
    closeModal();
    render();
    try {
      await db(
        `INSERT INTO app_medication_tracker__medications
           (id, member_id, name, dosage, notes, reminder_times, reminders_on,
            days_mask, every_n_days, started_on, ends_on, remind_member_ids, buddy_member_ids,
            archived, created_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 0, ?)`,
        [id, memberId, name, dosage, notes, timesJson, remindersOn,
          daysMask, everyNDays, startedOn, endsOn, remindMemberIds, buddyMemberIds, now]
      );
      await Promise.all([loadMedications(), loadReminderStatus()]);
      render();
    } catch (error) {
      medications = medications.filter(m => m.id !== id);
      render();
      hubAlert(`Could not add this medication: ${error.message}`);
    }
  }
};

// ── Archive / unarchive ────────────────────────────────────────────────────
window.archiveMedication = async function(id, archive) {
  const label = archive ? "archive" : "restore";
  const ok = await hubConfirm({ message: `${archive ? "Archive" : "Restore"} this medication?`, confirmLabel: label.charAt(0).toUpperCase() + label.slice(1), destructive: archive });
  if (!ok) return;

  // Optimistic: move between medications / archivedMeds arrays
  const previousMedications = medications.slice();
  const previousArchived = archivedMeds.slice();
  if (archive) {
    const idx = medications.findIndex(m => m.id === id);
    if (idx !== -1) {
      const [med] = medications.splice(idx, 1);
      archivedMeds.push(withArchivedState(med, true));
    }
  } else {
    const idx = archivedMeds.findIndex(m => m.id === id);
    if (idx !== -1) {
      const [med] = archivedMeds.splice(idx, 1);
      // Restoring does not silently restart a medication reminder. The editor
      // lets the user make that choice explicitly after the row is restored.
      medications.push(withArchivedState(med, false));
    }
  }
  closeModal();
  render();

  try {
    await db(
      `UPDATE app_medication_tracker__medications
          SET archived = ?, reminders_on = 0
        WHERE id = ?`,
      [archive ? 1 : 0, id],
    );
    await Promise.all([loadMedications(), loadReminderStatus()]);
    render();
  } catch (error) {
    medications = previousMedications;
    archivedMeds = previousArchived;
    render();
    hubAlert(`Could not ${label} this medication: ${error.message}`);
  }
};

// ── Modals ─────────────────────────────────────────────────────────────────
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }
window.closeModal = closeModal;

window.openAddModal = function() {
  const me = myMember();
  const adultMembers = amManage(me) ? members : [me].filter(Boolean);

  const memberOptions = adultMembers
    .map(m => `<option value="${esc(m.id)}" ${m.id === me?.id ? "selected" : ""}>${esc(m.name)}</option>`)
    .join("");

  const scheduleEditor = scheduleEditorHtml(["08:00"], true, {
    member_id: me?.id ?? "", every_n_days: 1, buddy_member_ids: "[]",
  });

  const memberRow = adultMembers.length > 1
    ? `<div class="form-group">
        <label>For</label>
        <select id="f-member">${memberOptions}</select>
       </div>`
    : `<input type="hidden" id="f-member" value="${esc(me?.id ?? "")}" />`;

  openModal(`
    <h3>Add Medication</h3>
    ${memberRow}
    <div class="form-group">
      <label>Medication Name</label>
      <input id="f-name" type="text" placeholder="e.g. Amoxicillin" autocomplete="off" />
    </div>
    <div class="form-group">
      <label>Dosage <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input id="f-dosage" type="text" placeholder="e.g. 500mg" />
    </div>
    <div class="form-group">
      <label>Notes <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <textarea id="f-notes" placeholder="e.g. Take with food"></textarea>
    </div>
    ${scheduleEditor}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-action="save-med">Add Medication</button>
    </div>
  `);

  renderEditorTimes();
  document.getElementById("f-name")?.focus();
};

window.openEditModal = function(id) {
  const allMeds = [...medications, ...archivedMeds];
  const med = allMeds.find(m => m.id === id);
  if (!med) return;

  const me = myMember();
  const owner = members.find(m => m.id === med.member_id);
  const scheduleEditor = scheduleEditorHtml(medicationTimes(med), remindersEnabled(med), med);

  const archiveBtn = !med.archived
    ? `<button class="btn btn-ghost btn-sm" data-action="archive-med" data-med-id="${esc(id)}" data-archived="true">Archive</button>`
    : `<button class="btn btn-ghost btn-sm" data-action="archive-med" data-med-id="${esc(id)}" data-archived="false">Restore</button>`;

  const ownerName = owner ? esc(owner.name) : "Unknown";

  openModal(`
    <h3>Edit Medication</h3>
    <p style="font-size:.82rem;color:var(--muted);margin-bottom:14px">For <strong>${ownerName}</strong></p>
    <input type="hidden" id="f-member" value="${esc(med.member_id)}" />
    <div class="form-group">
      <label>Medication Name</label>
      <input id="f-name" type="text" value="${esc(med.name)}" />
    </div>
    <div class="form-group">
      <label>Dosage <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input id="f-dosage" type="text" value="${esc(med.dosage)}" />
    </div>
    <div class="form-group">
      <label>Notes <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <textarea id="f-notes">${esc(med.notes)}</textarea>
    </div>
    ${scheduleEditor}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" data-action="save-med" data-med-id="${esc(id)}">Save</button>
    </div>
    <div class="modal-danger-zone">
      ${archiveBtn}
    </div>
  `);

  renderEditorTimes();
  document.getElementById("f-name")?.focus();
};

// ── Rendering ──────────────────────────────────────────────────────────────
function avatarHtml(member, size = 34) {
  const color = memberColor(member?.id ?? "", members);
  const letter = initial(member?.name ?? "?");
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color}">${esc(letter)}</div>`;
}

function slotPillsHtml(med) {
  // The dose "slot" IS the clock time from 1.1.0 — that is the key the hub's
  // schedule_reminders completion lookup matches against, so a tick here is
  // what stops the nudge escalating.
  return medicationTimes(med).map(time => {
    const taken = isDoseTaken(doses, med.id, time, TODAY);
    return `<button class="slot-pill${taken ? " taken" : ""}"
              data-action="toggle-dose" data-med-id="${esc(med.id)}" data-slot="${esc(time)}"
              title="${taken ? "Mark as not taken" : "Mark as taken"}">
              ${taken ? "✓ " : ""}${esc(formatTime(time))}
            </button>`;
  }).join("");
}

function medRowHtml(med, showEditBtn = false) {
  const done = allDosesComplete(med, doses, TODAY);
  const editBtn = showEditBtn
    ? `<button class="btn-icon" data-action="edit-med" data-med-id="${esc(med.id)}" title="Edit">✎</button>`
    : "";
  const notMonitored = remindersEnabled(med) && unmonitoredIds().has(String(med.id));
  return `
    <div class="med-row${med.archived ? " archived-row" : ""}">
      <div class="med-row-top">
        <div>
          <div class="med-name">${esc(med.name)}</div>
          ${med.dosage ? `<div class="med-dosage">${esc(med.dosage)}</div>` : ""}
          ${med.notes ? `<div class="med-notes">${esc(med.notes)}</div>` : ""}
          ${notMonitored ? `<div class="med-notes"><strong>Reminder not monitored — turn another reminder off or upgrade.</strong></div>` : ""}
        </div>
        <div class="med-actions">${editBtn}</div>
      </div>
      ${!med.archived ? `<div class="slots">${slotPillsHtml(med)}</div>` : ""}
    </div>
  `;
}

function memberSectionHtml(member, meds, title, canEdit) {
  const done = meds.length > 0 && meds.every(m => allDosesComplete(m, doses, TODAY));
  const doneBadge = done ? `<span class="badge-done">All done ✓</span>` : "";
  const rows = meds.map(m => medRowHtml(m, canEdit)).join("");
  return `
    <div class="card">
      <div class="card-header">
        ${avatarHtml(member, 34)}
        <span class="member-name">${esc(title)}</span>
        ${doneBadge}
      </div>
      ${rows || `<div class="empty" style="padding:16px">No active medications</div>`}
    </div>
  `;
}

function renderToday(me, visible) {
  if (!visible.length) {
    return `<div class="empty">No medications to track today.<br>${amManage(me) ? "Add one below." : "Ask a parent to add medications."}</div>`;
  }

  const byMember = groupByMember(visible);
  let html = "";

  // Own section first
  const myMeds = byMember.get(me?.id) ?? [];
  if (myMeds.length) {
    const owner = members.find(m => m.id === me?.id) ?? me;
    html += memberSectionHtml(owner, myMeds, "Your Medications", amManage(me));
  }

  if (amManage(me)) {
    // Children's sections
    const children = members.filter(m => m.role === "child");
    for (const child of children) {
      const childMeds = byMember.get(child.id) ?? [];
      if (childMeds.length) {
        html += memberSectionHtml(child, childMeds, child.name, true);
      }
    }

    // Other adults' medications (adults can see the whole household)
    const otherAdultSections = [];
    for (const [memberId, meds] of byMember) {
      if (memberId === me?.id) continue;
      const owner = members.find(m => m.id === memberId);
      if (!owner || !isAdult(owner)) continue; // already handled children above
      otherAdultSections.push({ owner, meds });
    }
    if (otherAdultSections.length) {
      html += `<p class="section-title">Other Adults</p>`;
      for (const { owner, meds } of otherAdultSections) {
        html += memberSectionHtml(owner, meds, owner.name, false);
      }
    }
  }

  return html;
}

function renderManage(me) {
  if (!amManage(me)) {
    return `<div class="empty">Only adults can manage medications.</div>`;
  }

  const allVisible = [
    ...medications.filter(med => canViewMedication(med, me, members)),
    ...(showArchived ? archivedMeds.filter(med => canViewMedication(med, me, members)) : []),
  ];

  const shown = searchQ
    ? allVisible.filter(med => searchMatch(searchQ, searchableFields(med)))
    : allVisible;

  const rows = shown.map(med => {
    const owner = members.find(m => m.id === med.member_id);
    const canEdit = canEditMedication(med, me, members);
    const slotLabels = medicationTimes(med).map(formatTime).join(", ");
    const remindersOff = !remindersEnabled(med) ? " · <em>reminders off</em>" : "";
    const editBtn = canEdit
      ? `<button class="btn-icon" data-action="edit-med" data-med-id="${esc(med.id)}" title="Edit">✎</button>`
      : "";
    return `
      <div class="manage-row${med.archived ? " archived-row" : ""}">
        ${avatarHtml(owner, 30)}
        <div class="manage-info">
          <div class="name">${esc(med.name)}${med.dosage ? ` <span style="font-weight:400;color:var(--muted)">${esc(med.dosage)}</span>` : ""}</div>
          <div class="meta">${esc(owner?.name ?? "Unknown")} · ${esc(slotLabels)}${remindersOff}${med.archived ? " · <em>archived</em>" : ""}</div>
        </div>
        ${med.archived ? `<span class="archived-badge">Archived</span>` : ""}
        ${editBtn}
      </div>
    `;
  }).join("");

  const addBtn = `<button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Medication</button>`;

  return `
    <div class="filter-bar">
      ${addBtn}
      <label class="show-archived-toggle">
        <input type="checkbox" ${showArchived ? "checked" : ""} onchange="toggleShowArchived(this.checked)" />
        Show archived
      </label>
    </div>
    ${allVisible.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search medications…" aria-label="Search medications" value="${esc(searchQ)}" /></div>` : ""}
    <div class="card">
      ${rows || `<div class="empty">${searchQ ? `Nothing matches "${esc(searchQ)}".` : "No medications yet. Add one above."}</div>`}
    </div>
  `;
}

// render() rewrites the whole view, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");
  if (next) { next.focus(); next.setSelectionRange(caret, caret); }
});

window.toggleShowArchived = function(val) {
  showArchived = val;
  render();
};

function render() {
  const me = myMember();
  const visible = visibleMeds();

  const dateLabel = new Date().toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  const manageTabVisible = amManage(me);

  const tabsHtml = manageTabVisible ? `
    <div class="tabs">
      <button class="tab ${activeTab === "today" ? "active" : ""}" onclick="switchTab('today')">Today</button>
      <button class="tab ${activeTab === "manage" ? "active" : ""}" onclick="switchTab('manage')">Manage</button>
    </div>
  ` : "";

  let bodyHtml = "";
  if (activeTab === "today" || !manageTabVisible) {
    bodyHtml = renderToday(me, visible);
  } else {
    bodyHtml = renderManage(me);
  }

  document.getElementById("root").innerHTML = `
    <header>
      <div class="header-left">
        <h1>💊 Medications</h1>
        <div class="date-label">${esc(dateLabel)}</div>
      </div>
    </header>
    ${reminderStatusHtml()}
    ${tabsHtml}
    ${bodyHtml}
  `;
}

window.switchTab = function(tab) {
  activeTab = tab;
  render();
};

// Delegated action handler. Medication ids come from the DB and are
// attacker-controllable via raw /api/db, so they must not be interpolated into
// inline onclick handlers (HTML-escaping is insufficient once the browser decodes
// the attribute before the JS parser runs). Carry ids on data-* attributes.
// Bound to document so it also covers buttons rendered inside modals.
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  switch (el.dataset.action) {
    case "toggle-dose": window.toggleDose(el.dataset.medId, el.dataset.slot); break;
    case "edit-med":    window.openEditModal(el.dataset.medId); break;
    case "archive-med": window.archiveMedication(el.dataset.medId, el.dataset.archived === "true"); break;
    case "save-med":    window.submitMedication(el.dataset.medId ?? null); break;
    case "add-time":    window.addEditorTime(); break;
    case "remove-time": window.removeEditorTime(el.dataset.time); break;
  }
});

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  await Promise.all([loadMembers(), loadMedications(), loadDoses()]);
  await loadReminderStatus();
  render();
})();
window.addEventListener("focus", () => { void refreshLocalDay(); void loadReminderStatus().then(render); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { void refreshLocalDay(); void loadReminderStatus().then(render); }
});
setInterval(() => { void refreshLocalDay(); }, 60_000);
</script>
